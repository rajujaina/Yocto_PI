# Custom kernel configuration for Raspberry Pi
# This file extends the default kernel configuration

# ==============================================================================
# I2C CONFIGURATION
# ==============================================================================
# Enable I2C support
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_BCM2835=y

# I2C device drivers (common sensors and devices)
CONFIG_I2C_MUX=y
CONFIG_I2C_MUX_PCA954x=y

# ==============================================================================
# SPI CONFIGURATION  
# ==============================================================================
# Enable SPI support
CONFIG_SPI=y
CONFIG_SPI_BCM2835=y
CONFIG_SPI_BCM2835AUX=y
CONFIG_SPI_SPIDEV=y

# ==============================================================================
# GPIO CONFIGURATION
# ==============================================================================
# GPIO support
CONFIG_GPIOLIB=y
CONFIG_GPIO_SYSFS=y
CONFIG_GPIO_BCM_VIRT=y

# ==============================================================================
# PWM CONFIGURATION
# ==============================================================================
# PWM support for servo control, LED dimming, etc.
CONFIG_PWM=y
CONFIG_PWM_BCM2835=y
CONFIG_PWM_SYSFS=y

# ==============================================================================
# UART/SERIAL CONFIGURATION
# ==============================================================================
# UART support
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y

# ==============================================================================
# CAMERA AND VIDEO
# ==============================================================================
# Camera support
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_V4L2=y
CONFIG_VIDEO_BCM2835=y

# ==============================================================================
# AUDIO CONFIGURATION
# ==============================================================================
# Audio support
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_SND_BCM2835_SOC_I2S=y

# ==============================================================================
# BLUETOOTH AND WIFI
# ==============================================================================
# Bluetooth support
CONFIG_BT=y
CONFIG_BT_UART=y
CONFIG_BT_BCM=y

# WiFi support  
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_BRCMFMAC=y

# ==============================================================================
# USB AND STORAGE
# ==============================================================================
# USB support
CONFIG_USB=y
CONFIG_USB_DWC2=y

# Storage support
CONFIG_MMC=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_IPROC=y